version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reserve_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reserve_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reserve_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-reserve_ai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserve_user -d reserve_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reserve_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: reserve_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://reserve_user:reserve_secure_pass@postgres:5432/reserve_ai_db
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:8001
      SECRET_KEY: ${SECRET_KEY:-reserve-ai-super-secure-production-ready-jwt-secret-key-2026}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ml-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.ml
    container_name: reserve_ml_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      ML_PORT: 8001

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: reserve_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:


services:
  # 1. FastAPI ML Microservice
  - type: web
    name: reserve-ai-ml-service
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r ml/requirements.txt
    startCommand: python -m ml.service
    envVars:
      - key: ML_PORT
        value: 8001
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. FastAPI Backend Engine
  - type: web
    name: reserve-ai-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: reserve-ai-ml-service
          property: host
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://reserve-ai.vercel.app,https://reserve-ai-backend.onrender.com"

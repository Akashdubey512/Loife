<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loafGrad" x1="20" y1="35" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5D076" />
      <stop offset="50%" stop-color="#E2A645" />
      <stop offset="100%" stop-color="#C47832" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="50" y1="10" x2="75" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E2A645" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded pill for high visibility on any tab bar -->
  <rect width="100" height="100" rx="28" fill="#0C1410" />

  <!-- Rounded Loaf Body with heart-contoured sharing base -->
  <path
    d="M24 64C18 64 14 59 14 51C14 38 29 32 50 32C71 32 86 38 86 51C86 59 82 64 76 64C71 64 67 61 63 58C59 55 54 53 50 53C46 53 41 55 37 58C33 61 29 64 24 64Z"
    fill="url(#loafGrad)"
    filter="url(#glow)"
  />

  <!-- Loaf score marks -->
  <path d="M36 39C38 42 40 46 40 49" stroke="#FFF6E8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M50 38C51 41 52 45 52 48" stroke="#FFF6E8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M64 39C62 42 60 46 60 49" stroke="#FFF6E8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Sprout Stem -->
  <path d="M50 32C50 24 52 17 58 13" stroke="url(#sproutGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Leaves -->
  <path d="M58 13C64 10 73 12 75 19C75 26 66 25 58 20" fill="url(#sproutGrad)" />
  <path d="M53 22C47 19 41 21 42 26C43 31 50 29 53 25" fill="url(#sproutGrad)" fill-opacity="0.9" />

  <!-- Accent heart dot -->
  <circle cx="50" cy="68" r="2.5" fill="#F4A261" />
</svg>